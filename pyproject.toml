[project]
name = "dtu-multimodal-emotion"
version = "1.0.0"
description = "Multimodal emotion recognition (SER + FER + TER + late-fusion meta-classifier) for student psychological trait inference"
authors = [
    { name = "Devesh Attri" },
    { name = "Harsh Sethi" },
    { name = "Gull Kaur" },
    { name = "Jai Kumar Meena", email = "jk422331@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"

# ---- Core ML dependencies (Linux CUDA + macOS Apple Silicon compatible) ----
dependencies = [
    # Core numerics
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.11,<1.13",
    "scikit-learn>=1.3,<2.0",
    "pillow>=10.0,<12.0",

    # Audio processing
    "librosa>=0.10,<0.11",
    "soundfile>=0.12",

    # Deep learning — platform-agnostic, install correct build via [project.optional-dependencies]
    # PINNED to the versions used in the Oct 2025 training run (transformers 4.35 + torch 2.5 + TF 2.13).
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.35.0",
    "tokenizers<0.16",
    "datasets>=2.14,<3.0",
    "huggingface-hub==0.17.3",

    # Gradio for the demo app (Gradio bundles its own pydantic compat shim)
    "gradio>=3.50,<5.0",

    # Utilities
    "requests>=2.30",
    "tqdm>=4.60",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# For Linux + NVIDIA CUDA GPUs (HPC default — what the user runs on the cluster)
# TF 2.15.x is the minimum version compatible with torch 2.5.x's typing-extensions
# constraint. The Oct 2025 training run used 2.13, but on the HPC with Python 3.11
# we need 2.15+ to coexist with torch 2.5+.
cuda = [
    "tensorflow==2.15.1",
    "keras<3.0",  # Standalone keras package for TF_USE_LEGACY_KERAS compat
]
# Document / report generation
docs = [
    "weasyprint>=60.0",
    "markdown>=3.5",
    "python-docx>=1.0",
    "pymupdf>=1.23",
]

# Scripts are invoked directly via `uv run python uv_run_all.py` or
# `uv run python train_*.py` — no console_scripts wrapper needed.
# (Earlier pyproject had broken [project.scripts] entries; removed.)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No package — this is an application repo, not a library
exclude = [".venv", "**/__pycache__", "model_checkpoints", "combined_ser_dataset", "ser_feature_output"]

[tool.uv]
# uv-native configuration
managed = true
package = false